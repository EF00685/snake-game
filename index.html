<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>贪吃蛇 Snake</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 14px;
    background: #12141a; color: #e8eaf0;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    -webkit-user-select: none; user-select: none;
    touch-action: none;
  }
  h1 { margin: 0; font-size: 20px; font-weight: 600; letter-spacing: .12em; color: #9aa3b2; }
  .hud { display: flex; gap: 28px; font-size: 15px; color: #9aa3b2; }
  .hud b { color: #4ade80; font-variant-numeric: tabular-nums; }
  .board { position: relative; }
  canvas {
    display: block; border-radius: 12px; background: #1a1d26;
    box-shadow: 0 0 0 1px #262b38, 0 18px 40px -18px #000;
    width: min(86vw, 420px); height: auto; aspect-ratio: 1;
  }
  .overlay {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 10px;
    border-radius: 12px; background: rgba(18, 20, 26, .82);
    backdrop-filter: blur(2px); text-align: center; padding: 16px;
  }
  .overlay.hidden { display: none; }
  .overlay strong { font-size: 22px; }
  .overlay span { font-size: 13px; color: #9aa3b2; line-height: 1.6; }
  .hint { font-size: 12px; color: #6b7280; }
</style>
</head>
<body>
  <h1>SNAKE</h1>
  <div class="hud">
    <span>得分 <b id="score">0</b></span>
    <span>最高 <b id="best">0</b></span>
  </div>

  <div class="board">
    <canvas id="game" width="600" height="600"></canvas>
    <div class="overlay" id="overlay">
      <strong id="title">贪吃蛇</strong>
      <span id="msg">方向键 / WASD 控制<br>手机滑动屏幕</span>
      <span class="hint">按 空格 开始</span>
    </div>
  </div>

  <div class="hint">空格 开始 / 重开</div>

<script>
(() => {
  const COLS = 20, ROWS = 20;
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const scoreEl = document.getElementById('score');
  const bestEl = document.getElementById('best');
  const overlay = document.getElementById('overlay');
  const titleEl = document.getElementById('title');
  const msgEl = document.getElementById('msg');
  const CELL = canvas.width / COLS;

  const STATE = { READY: 'ready', RUNNING: 'running', OVER: 'over', WIN: 'win' };

  let snake, dir, nextDir, food, score, best, state, timer;

  best = Number(localStorage.getItem('snake-best') || 0);
  bestEl.textContent = best;

  function reset() {
    const mid = Math.floor(COLS / 2);
    snake = [{ x: mid, y: mid }, { x: mid - 1, y: mid }, { x: mid - 2, y: mid }];
    dir = { x: 1, y: 0 };
    nextDir = dir;
    score = 0;
    scoreEl.textContent = '0';
    placeFood();
    draw();
  }

  function placeFood() {
    const free = [];
    for (let y = 0; y < ROWS; y++) {
      for (let x = 0; x < COLS; x++) {
        if (!snake.some(s => s.x === x && s.y === y)) free.push({ x, y });
      }
    }
    food = free.length ? free[Math.floor(Math.random() * free.length)] : null;
  }

  function start() {
    reset();
    state = STATE.RUNNING;
    overlay.classList.add('hidden');
    clearInterval(timer);
    timer = setInterval(tick, 130);
  }

  function tick() {
    dir = nextDir;
    const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

    const hitWall = head.x < 0 || head.y < 0 || head.x >= COLS || head.y >= ROWS;
    const hitSelf = snake.some((s, i) => i < snake.length - 1 && s.x === head.x && s.y === head.y);
    if (hitWall || hitSelf) return gameOver();

    snake.unshift(head);

    if (food && head.x === food.x && head.y === food.y) {
      score += 10;
      scoreEl.textContent = score;
      if (score > best) {
        best = score;
        bestEl.textContent = best;
        localStorage.setItem('snake-best', best);
      }
      placeFood();
      if (!food) return win();
    } else {
      snake.pop();
    }
    draw();
  }

  function gameOver() {
    state = STATE.OVER;
    clearInterval(timer);
    overlay.classList.remove('hidden');
    titleEl.textContent = '游戏结束';
    msgEl.textContent = '得分 ' + score;
    draw();
  }

  function win() {
    state = STATE.WIN;
    clearInterval(timer);
    overlay.classList.remove('hidden');
    titleEl.textContent = '通关！';
    msgEl.textContent = '你填满了整个棋盘';
    draw();
  }

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(x, y, w, h, r);
    else ctx.rect(x, y, w, h);
    ctx.fill();
  }

  function draw() {
    ctx.fillStyle = '#1a1d26';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // 棋盘网格
    ctx.strokeStyle = '#20242f';
    ctx.lineWidth = 1;
    for (let i = 1; i < COLS; i++) {
      ctx.beginPath();
      ctx.moveTo(i * CELL, 0); ctx.lineTo(i * CELL, canvas.height);
      ctx.moveTo(0, i * CELL); ctx.lineTo(canvas.width, i * CELL);
      ctx.stroke();
    }

    if (food) {
      ctx.fillStyle = '#ef4444';
      ctx.beginPath();
      ctx.arc((food.x + 0.5) * CELL, (food.y + 0.5) * CELL, CELL * 0.32, 0, Math.PI * 2);
      ctx.fill();
    }

    snake.forEach((seg, i) => {
      ctx.fillStyle = i === 0 ? '#4ade80' : '#22c55e';
      roundRect(seg.x * CELL + 2, seg.y * CELL + 2, CELL - 4, CELL - 4, 6);
    });
  }

  function turn(x, y) {
    if (state !== STATE.RUNNING) return;
    if (x === -dir.x && y === -dir.y) return; // 不能原地掉头
    if (x === dir.x && y === dir.y) return;
    nextDir = { x, y };
  }

  const KEYS = {
    ArrowUp: [0, -1], ArrowDown: [0, 1], ArrowLeft: [-1, 0], ArrowRight: [1, 0],
    w: [0, -1], s: [0, 1], a: [-1, 0], d: [1, 0],
    W: [0, -1], S: [0, 1], A: [-1, 0], D: [1, 0],
  };

  window.addEventListener('keydown', e => {
    if (e.key === ' ' || e.code === 'Space') {
      e.preventDefault();
      if (state !== STATE.RUNNING) start();
      return;
    }
    const k = KEYS[e.key];
    if (!k) return;
    e.preventDefault();
    if (state === STATE.READY) start();
    turn(k[0], k[1]);
  });

  let touchStart = null;
  canvas.addEventListener('touchstart', e => {
    touchStart = { x: e.touches[0].clientX, y: e.touches[0].clientY };
  }, { passive: true });

  canvas.addEventListener('touchend', e => {
    if (!touchStart) return;
    const t = e.changedTouches[0];
    const dx = t.clientX - touchStart.x, dy = t.clientY - touchStart.y;
    touchStart = null;
    if (Math.hypot(dx, dy) < 20) return;
    if (state !== STATE.RUNNING) return start();
    if (Math.abs(dx) > Math.abs(dy)) turn(dx > 0 ? 1 : -1, 0);
    else turn(0, dy > 0 ? 1 : -1);
  }, { passive: true });

  state = STATE.READY;
  reset();
})();
</script>
</body>
</html>
